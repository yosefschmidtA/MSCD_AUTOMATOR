<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSCD Web Automator</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
</head>
<body>

<div class="main-wrapper">
    <div class="content-main">
        <div class="container">
            <h1>MSCD Solver</h1>
            <p style="margin-top: -15px; margin-bottom: 20px; font-size: 14px; color: #7f8c8d;">XPD Phase Shift & Radial Matrix Generator</p>
            <form id="simulationForm">
                <textarea id="inputCluster" name="inputCluster" placeholder="Paste your input_cluster.txt content here..."></textarea>
                <div class="button-group">
                    <div id="status">⌛ Processing cluster data...</div>
                    <button type="submit" id="btnRun">Generate ps & rm</button>
                    <button type="button" onclick="visualizarEstrutura()" style="background: var(--accent); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold;">👁️ Visualizar 3D</button>
                </div>
            </form>
        </div>

        <div id="resultsCard">
            <h3 style="color: var(--success); margin-bottom: 10px;">✅ Success!</h3>
            <p style="margin: 0 0 15px 0; font-size: 14px;">Files generated successfully and ready for download.</p>
            <a href="#" id="downloadLink" style="background: var(--accent); color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: inline-block;">📥 Download ZIP</a>
        </div>
    </div>

    <div class="sidebar">
        <h3>3D Visualization</h3>
        <div id="container-3d" style="height: 400px; width: 100%; background: #fff; border-radius: 8px; border: 1px solid #ddd;"></div>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <h3>Resources</h3>
        <div class="example-box">
            <p>New to the format? Download the official input template:</p>
            <a href="/download_exemplo" class="btn-exemplo">📄 Download example.txt</a>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        const form = document.getElementById('simulationForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const content = document.getElementById('inputCluster').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btnRun');
            const resultsCard = document.getElementById('resultsCard');
            const downloadLink = document.getElementById('downloadLink');

            if(!content.trim()) return alert("Input field is empty!");

            resultsCard.style.display = 'none';
            status.style.display = 'block';
            btn.disabled = true;
            btn.innerText = "Processing...";

            fetch('/rodar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 'inputCluster': content })
            })
            .then(response => {
                if (!response.ok) throw new Error('Server error');
                return response.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                downloadLink.href = url;
                downloadLink.download = 'mscd_results.zip';
                resultsCard.style.display = 'block';
                status.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "Generate ps & rm";
            })
            .catch(error => {
                alert("Processing failed!");
                btn.disabled = false;
                status.style.display = 'none';
                btn.innerText = "Generate ps & rm";
            });
        });
    };
</script>

<script src="{{ url_for('static', filename='js/viewer.js') }}"></script>

</body>
</html>
