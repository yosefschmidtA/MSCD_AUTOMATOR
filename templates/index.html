<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSCD Web Automator - XPD Solver</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 0.9em; margin-bottom: 20px; }
        
        /* Estilo Editor de Código */
        textarea {
            width: 100%;
            height: 350px;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #1e1e1e; /* Dark mode para o input */
            color: #d4d4d4;
            resize: vertical;
            box-sizing: border-box;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .button-group {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #btnRun {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }
        
        #btnRun:hover { background-color: #219150; }
        #btnRun:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        #status {
            padding: 15px;
            border-radius: 4px;
            background-color: #e8f4fd;
            border-left: 5px solid #3498db;
            color: #2980b9;
            display: none; /* Escondido por padrão */
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        
        .footer { margin-top: 30px; font-size: 0.8em; color: #bdc3c7; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MSCD Simulation Input</h1>
        <div class="subtitle">Insira os dados do <strong>input_cluster.txt</strong> para gerar os arquivos ps1, ps2 e rm1.</div>
        
        <form id="simulationForm">
            <textarea id="inputCluster" name="inputCluster" placeholder="Exemplo:&#10;O 0.000 0.000 0.000&#10;Fe 1.234 0.567 0.890..."></textarea>
            
            <div class="button-group">
                <span id="msgExtra" style="font-size: 0.85em; color: #95a5a6;">Os arquivos serão salvos na pasta local.</span>
                <button type="submit" id="btnRun">Gerar Arquivos (ps1, ps2, rm1)</button>
            </div>
        </form>
    </div>

    <div id="status">
        <strong>⌛ Processando Simulação...</strong>
        <p style="margin: 5px 0 0 0; font-size: 0.9em;">Isso pode levar alguns segundos dependendo do tamanho do cluster.</p>
    </div>

    <div class="footer">Desenvolvido para cálculos de XPD teórico - 2026</div>

    <script>
        document.getElementById('simulationForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Não deixa a página recarregar
            
            const content = document.getElementById('inputCluster').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btnRun');

            if(!content.trim()) {
                alert("O campo de input está vazio!");
                return;
            }

            // Interface em modo "Carregando"
            statusDiv.style.display = 'block';
            btn.disabled = true;
            btn.innerText = "Calculando...";

            // Envia para o Flask
            fetch('/rodar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'inputCluster': content
                })
            })
            .then(response => response.text())
            .then(data => {
                alert(data); // "Sucesso!" ou "Erro!" vindo do Python
            })
            .catch(error => {
                console.error('Erro:', error);
                alert("Houve uma falha na comunicação com o servidor.");
            })
            .finally(() => {
                // Volta a interface ao normal
                statusDiv.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "Gerar Arquivos (ps1, ps2, rm1)";
            });
        });
    </script>
</body>
</html>
